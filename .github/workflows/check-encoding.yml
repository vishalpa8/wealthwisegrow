name: Check file encodings

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  encoding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run encoding check
        run: npm run check:encoding
