<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Blue-500 -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Emerald-500 -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="#0f172a" /> <!-- Slate-900 -->

  <!-- Icon group centered -->
  <g transform="translate(136, 136) scale(1.0)" filter="url(#shadow)">
    <!-- Main trending up line -->
    <path 
      d="M30 190 L90 130 L150 170 L230 40" 
      stroke="url(#icon-gradient)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Arrow head -->
    <path 
      d="M150 40 L230 40 L230 120" 
      stroke="url(#icon-gradient)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Decorative curve -->
    <path 
      d="M90 230 C 150 230, 200 150, 230 40" 
      stroke="url(#icon-gradient)" 
      stroke-width="20" 
      stroke-linecap="round" 
      opacity="0.5"
    />
  </g>
</svg>
